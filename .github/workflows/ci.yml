name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit/Integration Tests (Jest)
        run: npm run test:ci -- --coverage

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    env:
      # Prefer Neon ephemeral DATABASE_URL if provided via secrets at workflow_dispatch or org-level
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BASE_URL: http://localhost:3000
    services:
      # Fallback Postgres service when DATABASE_URL not provided
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        # Health checks
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Configure Postgres fallback DATABASE_URL if not provided
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres" >> $GITHUB_ENV
      - name: Show DATABASE_URL target
        run: echo Using DATABASE_URL=$DATABASE_URL
      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BASE_URL: ${{ env.BASE_URL }}
